# HEARTH routing policy — declarative, tuned without redeploy (ADR-005, ARCHITECTURE §3).
#
# THIS DEFAULT PROFILE IS NO-EGRESS. Every class runs `local`, escalates `never`, and there
# are ZERO remotes — so `hearth serve`, /v1/chat/completions and the /chat page cannot send a
# task off this machine unless the operator deliberately selects another profile. Escalation
# to a frontier model is opt-in:
#
#     HEARTH_ROUTING_YAML=config/routing.remote.yaml hearth serve
#
# (Until 2026-10 this file escalated `reason` to Claude by default and let short chat
# messages escalate on a length-based confidence stub. That profile is routing.remote.yaml.)
#
# Routing is *data, not code*. The engine (src/hearth/router/) executes this policy.
# A bad or missing file never crashes the server: HEARTH logs a warning and falls back
# to safe built-in defaults (every class local, never escalate).
#
# defaults:
#   local_model                   local model id; "auto" = registry default
#   remote                        which entry under `remotes:` escalation targets
#   remote_budget_tokens_per_day  per-UTC-day cap on remote tokens (budget accountant)
#
# classes.<name>:
#   backend      local | remote      where the class runs by default
#   escalate     never | on_low_confidence | always
#   threshold    confidence floor for on_low_confidence classes (0..1)
#   local_model  optional per-class local model id — one rung of a *local model ladder*
#                (e.g. a small fast model for classify/extract, a larger one for
#                summarize/draft). Must exist in config/models.yaml or the policy is
#                rejected at load time. Omit (or "auto") to inherit defaults.local_model.
#                Resolution order: request model -> class local_model -> defaults
#                .local_model -> registry default. See config/routing.finance.yaml.
#
# remotes.<name>:   (see config/routing.remote.yaml for a worked example)
#   protocol   anthropic | openai    anthropic uses the official SDK; openai is generic
#   model      model id to request
#   base_url   (openai only) OpenAI-compatible endpoint, e.g. a LAN server
#   api_key_env  env var holding the API key/bearer token (secrets never live in files)
#   thinking   (anthropic only) true → send thinking={"type":"adaptive"}; default off

defaults:
  local_model: auto
  remote: none                     # names a remote that does not exist -> remote_for() == None
  remote_budget_tokens_per_day: 0  # no remote budget at all

classes:
  summarize: { backend: local, escalate: never }
  extract:   { backend: local, escalate: never }
  classify:  { backend: local, escalate: never }
  rank:      { backend: local, escalate: never }
  draft:     { backend: local, escalate: never }
  code:      { backend: local, escalate: never }
  reason:    { backend: local, escalate: never }
  chat:      { backend: local, escalate: never }

remotes: {}   # no escalation targets exist — the router cannot egress a task
